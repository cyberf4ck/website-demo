<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wiz bizz</title>
<style>
:root{
  --bg:#0b0d0b;--text:#e9e6dc;--muted:#8d8a80;--line:#2a2d29;--card:#141714;
  --wood:#3a2515;--wood-dark:#24150b;--wood-light:#4a301b;--iron:#1b1d1c;--brass:#b08a3c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top,0px) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}

/* ---------- The page behind the door ---------- */
main{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:1.25rem;padding-top:1.5rem}
main img{display:block;max-width:100%;max-height:60vh;width:auto;height:auto;object-fit:contain}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.04em}
h2{margin:1rem 0 0;font-size:1rem;font-weight:600;color:var(--muted);align-self:flex-start}
form{width:100%;display:flex;flex-direction:column;gap:.6rem}
input,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:.5rem;padding:.7rem .85rem;font:inherit}
textarea{min-height:6rem;resize:vertical}
input:focus,textarea:focus{outline:2px solid #6b705f;outline-offset:1px}
.post{align-self:flex-start;background:var(--text);color:var(--bg);border:0;border-radius:.5rem;padding:.65rem 1.2rem;font:inherit;font-weight:600;cursor:pointer}
.post:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{min-height:1.2em;margin:0;font-size:.9rem;color:var(--muted);align-self:flex-start}
#list{list-style:none;padding:0;margin:0;width:100%;display:flex;flex-direction:column;gap:.75rem}
#list li{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.75rem 1rem}
#list time{margin-left:.6rem;font-size:.8rem;color:var(--muted)}
#list p{margin:.3rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted)}

/* ---------- Sound toggle (appears after the door opens) ---------- */
#mute{position:fixed;top:calc(.75rem + env(safe-area-inset-top,0px));right:.75rem;z-index:5;
background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:.5rem;padding:.4rem .75rem;font:inherit;font-size:.85rem;cursor:pointer}
#mute:hover{color:var(--text)}
#mute:focus-visible,#door:focus-visible .hint{outline:2px solid #c9b27a;outline-offset:3px}

/* ---------- The door ---------- */
#door{position:fixed;inset:0;z-index:10;display:block;width:100%;height:100%;padding:0;border:0;margin:0;
background:transparent;cursor:pointer;perspective:1400px;overflow:hidden;font:inherit;color:inherit;
transition:opacity .5s ease}
#door.gone{opacity:0;pointer-events:none}
.leaf{position:absolute;top:0;bottom:0;width:50%;backface-visibility:hidden;
transition:transform 1.7s cubic-bezier(.55,.05,.25,1);
background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 2px,transparent 2px 3.4rem),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),
  linear-gradient(90deg,var(--wood-dark),var(--wood) 35%,var(--wood-light) 60%,var(--wood-dark))}
.leaf.l{left:0;transform-origin:left center;box-shadow:inset -.6rem 0 1.5rem rgba(0,0,0,.55)}
.leaf.r{right:0;transform-origin:right center;box-shadow:inset .6rem 0 1.5rem rgba(0,0,0,.55)}
.leaf.r{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 2px,transparent 2px 3.4rem),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),
  linear-gradient(90deg,var(--wood-dark),var(--wood-light) 40%,var(--wood) 65%,var(--wood-dark))}
.band{position:absolute;left:0;right:0;height:2.4rem;
background:
  radial-gradient(circle at 1.4rem 50%,#555a56 0 .22rem,transparent .26rem) 0 0/3.2rem 100% repeat-x,
  linear-gradient(180deg,#2a2c2b,var(--iron) 50%,#0f1110);
box-shadow:0 .25rem .6rem rgba(0,0,0,.6)}
.band.top{top:18%}
.band.bottom{bottom:18%}
.ring{position:absolute;top:50%;width:3.4rem;height:3.4rem;margin-top:-1.7rem;border-radius:50%;
border:.45rem solid var(--brass);background:transparent;
box-shadow:0 .2rem .5rem rgba(0,0,0,.7),inset 0 0 .3rem rgba(0,0,0,.6)}
.l .ring{right:1.2rem}
.r .ring{left:1.2rem}
.hint{position:absolute;left:50%;bottom:calc(6% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;
padding:.5rem 1rem;border-radius:.4rem;background:rgba(10,8,5,.78);color:#e6d8b0;
font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.05rem;letter-spacing:.03em;white-space:nowrap;
transition:opacity .4s ease}
#door.open .hint{opacity:0}
#door.open .leaf.l{transform:rotateY(100deg)}
#door.open .leaf.r{transform:rotateY(-100deg)}

/* warm light spilling through the gap as the door opens */
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;
background:radial-gradient(ellipse at center,rgba(255,226,150,.55),rgba(255,226,150,0) 60%);
transition:opacity .9s ease .1s}
#door.open .glow{opacity:1;animation:fadeglow 1.4s ease 1s forwards}
@keyframes fadeglow{to{opacity:0}}

@media (max-width:30rem){
  .ring{width:2.6rem;height:2.6rem;margin-top:-1.3rem;border-width:.35rem}
  .l .ring{right:.6rem}.r .ring{left:.6rem}
  .hint{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  .leaf{transition:none}
  #door.open .leaf.l,#door.open .leaf.r{transform:none}
  #door.open .glow{animation:none;opacity:0}
}
</style>
</head>
<body>

<main id="page" inert>
<img src="wizard.png" alt="A man in a wizard hat and robe with a long white beard, smoking a pipe, holding a fan of cash and raising his middle finger">
<h1>wiz bizz</h1>

<h2>Leave a message</h2>
<form id="form" autocomplete="off">
<input id="nameEl" type="text" maxlength="40" placeholder="Your name" required>
<textarea id="msgEl" maxlength="300" placeholder="Your message (max 300 characters)" required></textarea>
<div class="hp" aria-hidden="true"><input id="hp" type="text" tabindex="-1" placeholder="Leave this empty"></div>
<button id="btn" class="post" type="submit">Post</button>
<p id="status" role="status"></p>
</form>

<h2>Messages</h2>
<ul id="list"></ul>
</main>

<button id="mute" type="button" aria-pressed="false" hidden>Sound on</button>

<button id="door" type="button" aria-label="Open the door to enter the site">
  <span class="leaf l"><span class="band top"></span><span class="band bottom"></span><span class="ring"></span></span>
  <span class="leaf r"><span class="band top"></span><span class="band bottom"></span><span class="ring"></span></span>
  <span class="glow"></span>
  <span class="hint">Click the door to enter</span>
</button>

<audio id="snd" src="door.mp3" preload="auto"></audio>

<script>
// ---- Door ----------------------------------------------------------------
const door = document.getElementById("door");
const page = document.getElementById("page");
const snd = document.getElementById("snd");
const muteBtn = document.getElementById("mute");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

door.addEventListener("click", () => {
  if (door.classList.contains("open")) return;
  door.classList.add("open");
  // This click is what lets the browser play sound.
  try { snd.currentTime = 0; const p = snd.play(); if (p) p.catch(() => {}); } catch (e) {}
  setTimeout(() => {
    page.removeAttribute("inert");
    door.classList.add("gone");
    muteBtn.hidden = false;
    setTimeout(() => { door.hidden = true; }, 600);
  }, reduceMotion ? 150 : 2000);
});

muteBtn.addEventListener("click", () => {
  snd.muted = !snd.muted;
  muteBtn.textContent = snd.muted ? "Sound off" : "Sound on";
  muteBtn.setAttribute("aria-pressed", String(snd.muted));
});

// ---- Supabase connection (both values are safe to be public) -------------
const SUPABASE_URL = "https://ijnqezquhvstgvbsrfvr.supabase.co";
const SUPABASE_KEY = "sb_publishable_LoEVUDlEkKvbj7Yqnv1z1w_JuhTvjeS";
// ---------------------------------------------------------------------------

const API = SUPABASE_URL + "/rest/v1/messages";
const headers = { apikey: SUPABASE_KEY };
const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const btn = document.getElementById("btn");
let lastPost = 0;

function setStatus(t){ statusEl.textContent = t; }
function note(t){
  list.textContent = "";
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = t;
  list.append(li);
}

async function load(){
  try {
    const r = await fetch(API + "?select=name,message,created_at&approved=eq.true&order=created_at.desc&limit=50", { headers });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if (!rows.length) { note("No messages yet. Be the first!"); return; }
    list.textContent = "";
    for (const m of rows) {
      const li = document.createElement("li");
      const b = document.createElement("b");
      b.textContent = m.name;
      const t = document.createElement("time");
      t.textContent = new Date(m.created_at).toLocaleDateString();
      const p = document.createElement("p");
      p.textContent = m.message;
      li.append(b, t, p);
      list.append(li);
    }
  } catch (e) {
    note("Couldn’t load messages right now.");
  }
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (document.getElementById("hp").value) return;
  const name = document.getElementById("nameEl").value.trim();
  const message = document.getElementById("msgEl").value.trim();
  if (!name || !message) return;
  if (Date.now() - lastPost < 30000) { setStatus("Please wait a bit before posting again."); return; }
  btn.disabled = true;
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { ...headers, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ name, message })
    });
    if (!r.ok) throw new Error(r.status);
    e.target.reset();
    lastPost = Date.now();
    setStatus("Thanks! Your message will show up once it’s approved.");
  } catch (err) {
    setStatus("Couldn’t send that. Try again in a moment.");
  }
  btn.disabled = false;
});

load();
</script>
</body>
</html>
